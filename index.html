<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wild2 — A Tiny Wilderness Adventure</title>
<style>
  :root { --bg:#0c0f0a; --card:#141a10; --line:#2a341f; --text:#e9efdc; --muted:#9aab84; --accent:#a3c563; --gold:#e6c46a; --bad:#e0857a; --good:#8fd68a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Georgia',serif; background:radial-gradient(circle at 50% -10%,#1a2412,#0c0f0a); color:var(--text); min-height:100vh; display:flex; justify-content:center; padding:20px; }
  .game { max-width:720px; width:100%; }
  h1 { text-align:center; font-size:2rem; letter-spacing:.12em; color:var(--accent); text-shadow:0 0 18px #4a6a1f; margin-bottom:2px; }
  .sub { text-align:center; color:var(--muted); font-size:.74rem; letter-spacing:.22em; margin-bottom:16px; }
  .stats { display:flex; gap:10px; flex-wrap:wrap; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; font-size:.82rem; margin-bottom:14px; }
  .stat { display:flex; flex-direction:column; }
  .stat .l { color:var(--muted); font-size:.66rem; letter-spacing:.08em; }
  .stat .v { color:var(--accent); font-weight:bold; }
  .story { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; line-height:1.75; white-space:pre-wrap; min-height:160px; }
  .gold{color:var(--gold)} .bad{color:var(--bad)} .good{color:var(--good)} .muted{color:var(--muted)}
  .choices { display:flex; flex-direction:column; gap:9px; margin-top:14px; }
  .btn { background:#141a10; border:1px solid var(--accent); color:var(--accent); text-align:left; padding:12px 16px; border-radius:8px; cursor:pointer; font-family:inherit; font-size:.95rem; transition:.15s; }
  .btn:hover { background:var(--accent); color:#10160a; }
  .btn.alt { border-color:var(--line); color:var(--text); }
  .log { color:var(--muted); font-size:.78rem; margin-top:10px; min-height:18px; text-align:center; font-style:italic; }
  .saved-note { text-align:center; font-size:.72rem; color:var(--muted); margin-top:8px; }
</style>
</head>
<body>
<div class="game">
  <h1>❧ WILD2 ❧</h1>
  <div class="sub">A TINY WILDERNESS ADVENTURE · THE GREENWILD</div>
  <div class="stats" id="stats"></div>
  <div class="story" id="story"></div>
  <div class="choices" id="choices"></div>
  <div class="log" id="log"></div>
  <div class="saved-note" id="savenote"></div>
  <div id="codex" style="margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px"></div>
</div>
<script>
const SKEY='wild2_save_v1';
const $=id=>document.getElementById(id);
let S = { hp:100, stamina:100, courage:50, supplies:50, role:'', node:'role', endings:load('wild2_endings',[]) };
function load(k,d){ try{ return JSON.parse(localStorage.getItem(k))??d; }catch(e){ return d; } }
function saveGame(){ localStorage.setItem(SKEY, JSON.stringify(S)); }
function clearGame(){ localStorage.removeItem(SKEY); }

const ROLES={
  Ranger:{hp:10,stamina:20,courage:0,supplies:0,blurb:'tracker and pathfinder; you read the land like a page.'},
  Wanderer:{hp:0,stamina:10,courage:20,supplies:0,blurb:'free-footed and lucky; trouble slides off you.'},
  Scholar:{hp:0,stamina:0,courage:10,supplies:20,blurb:'you carry knowledge and careful provisions.'},
  Guardian:{hp:25,stamina:0,courage:10,supplies:0,blurb:'steadfast and strong; you stand when others run.'},
};

function stats(){
  if(!S.role){ $('stats').innerHTML=''; return; }
  $('stats').innerHTML=`
   <div class="stat"><span class="l">PATH</span><span class="v">${S.role}</span></div>
   <div class="stat"><span class="l">HEALTH</span><span class="v">${Math.max(0,S.hp)}</span></div>
   <div class="stat"><span class="l">STAMINA</span><span class="v">${Math.max(0,S.stamina)}</span></div>
   <div class="stat"><span class="l">COURAGE</span><span class="v">${S.courage}</span></div>
   <div class="stat"><span class="l">SUPPLIES</span><span class="v">${Math.max(0,S.supplies)}</span></div>`;
}
function log(m){ $('log').textContent=m||''; }
function go(id){ S.node=id; saveGame(); render(); }

const N={
  role:{ text:`The Greenwild is the last wild forest, and something at its heart has gone quiet — the old <span class="gold">Heartspring</span> that feeds every river has stopped singing. The villages sent word for someone to walk in and find out why.

You volunteered.

Who are you, traveller?`,
    roleSelect:true },

  start:{ text:()=>`You step past the last fence-post and into the trees. The Greenwild closes behind you — green light, deep moss, birdsong that stops when you listen for it.

As a <span class="gold">${S.role}</span>, you are ${ROLES[S.role].blurb}

Two ways lead inward: the old <span class="gold">trail</span>, overgrown but known, or the <span class="gold">river</span>, faster but loud and exposed.`,
    choices:[
      {t:'Follow the overgrown trail.', f:()=>{S.stamina-=10; log('The brush is thick going. Stamina -10');}, n:'danger'},
      {t:'Wade up the river.', f:()=>{S.supplies-=10; log('Your pack takes on water. Supplies -10');}, n:'danger'},
    ]},

  danger:{ text:`By dusk you reach a ravine where the path has collapsed. On the far side, the forest darkens toward the Heartspring. Below, a <span class="gold">greatcat</span> — lean, scarred, hungry — paces the only crossing. It has not seen you yet.`,
    choices:[
      {t:'Stand tall and face it down.', f:()=>{ if(S.courage>=55){S.courage+=5; log('Your nerve holds. The cat yields. Courage +5');} else {S.hp-=25; log('It lunges before it backs off. Health -25');} }, n:'discovery'},
      {t:'Slip around quietly through the dark.', f:()=>{S.stamina-=15; log('A long, careful detour. Stamina -15');}, n:'discovery'},
      {t:'Offer it food from your pack.', f:()=>{ if(S.supplies>=15){S.supplies-=15; S.courage+=3; log('It eats, watches, lets you pass. Supplies -15');} else {S.hp-=15; log('You have too little; it takes offence. Health -15');} }, n:'discovery'},
    ]},

  discovery:{ text:`Past the ravine you find the Heartspring at last — a great stone basin where water should well up and sing. Instead it is choked: a fallen ironwood has cracked the basin, and a tangle of <span class="gold">blackthorn</span> has rooted in the wound, drinking the spring dry.

Kneeling beside it is a <span class="gold">child of the wood</span> — a small, bark-skinned forest-spirit, exhausted, trying and failing to pull the thorns alone.

"You came," it breathes. "I cannot do this by myself."`,
    choices:[
      {t:'Clear the thorns by hand, whatever it costs.', f:()=>{S.hp-=15; S.stamina-=15; log('Thorns tear at you. Health -15, Stamina -15');}, n:'final'},
      {t:'Use what you carry — rope, tools, knowledge.', f:()=>{ if(S.supplies>=10||S.role==='Scholar'){S.supplies=Math.max(0,S.supplies-10); log('You rig a clever pull. The thorns give.');} else {S.hp-=20; log('Without the right gear, it costs you. Health -20');} }, n:'final'},
      {t:'Ask the spirit to lend you the forest\'s strength.', f:()=>{ if(S.courage>=55){log('The wood answers your courage.');} else {S.stamina-=20; log('The forest tests you first. Stamina -20');} }, n:'final'},
    ]},

  final:{ text:`The last blackthorn root comes free. For a moment, nothing.

Then — deep under the stone — a sound like a held breath let go. Water rises, clear and cold, and the Heartspring <span class="good">sings</span> again. The whole forest seems to lean in and listen.

The child of the wood looks up at you, and at the cracked basin still leaking at the rim.

"It sings," it says, "but the crack remains. You could stay, and help me tend it as it heals — seasons of work. Or carry the news home, and let the wild mend itself in its own slow time. Or—" it hesitates "—you could take a cutting of the living spring, and carry its song to the dry lands beyond."`,
    choices:[
      {t:'Stay and tend the spring.', n:'end_tender'},
      {t:'Carry the news home.', n:'end_herald'},
      {t:'Take a cutting to the dry lands.', n:'end_seedbearer'},
      {t:'Ask the spirit what it truly wants.', f:()=>{S.courage+=5;}, n:'end_kin'},
    ]},

  end_tender:{ end:true, title:'THE TENDER', tone:'good',
    text:`You stay. Through three seasons you and the wood-child seal the basin, root by root, stone by stone, until the Heartspring runs whole and certain.

The villages downstream never learn your name. Their rivers simply never fail again.

<span class="good">Some good is done where no one is watching.</span>` },
  end_herald:{ end:true, title:'THE HERALD', tone:'',
    text:`You carry the news home, and the villages send hands and tools back into the Greenwild to help the spirit mend the spring properly.

The forest heals slower for your leaving — but a hundred people now know the way in, and the Heartspring will never again be one tired spirit's secret burden.

<span class="muted">You could not save it alone. So you made sure no one had to.</span>` },
  end_seedbearer:{ end:true, title:'THE SEED-BEARER', tone:'gold',
    text:`You take a cutting of the living spring, wrapped in moss and song, and walk it out past the Greenwild into the cracked dry lands beyond.

Where you plant it, green returns. It is a risk — a wild thing loosed in new soil — but the world is wider than one forest, and now so is its song.

<span class="gold">You did not just heal a wound. You carried the cure outward.</span>` },
  end_kin:{ end:true, title:'KIN OF THE WILD', tone:'good',
    text:`You ask, and the spirit weeps — not from sorrow. No one had asked in a very long time.

"I want," it says, "not to be the last." So you stay long enough to learn its old work, and you become the first of a new line of wardens: people of the villages who will walk in, season on season, and keep the wild company.

<span class="good">The Greenwild's deepest lack was never water. It was kin.</span>` },
  end_lost:{ end:true, title:'TAKEN BY THE WILD', tone:'bad',
    text:`Your strength fails before the Heartspring is freed. The Greenwild is not cruel — only old, and vast, and indifferent. It folds quietly over you like moss over a stone.

<span class="bad">The forest keeps what it takes.</span>` },
};

const ALL_ENDINGS=[['end_tender','The Tender'],['end_herald','The Herald'],['end_seedbearer','The Seed-Bearer'],['end_kin','Kin of the Wild'],['end_lost','Taken by the Wild']];
function renderCodex(){
  const done=S.endings.length;
  $('codex').innerHTML=`<div style="font-size:.78rem;letter-spacing:.1em;color:var(--muted);margin-bottom:8px">WARDEN'S CODEX · ${done}/5 ENDINGS</div>`+
    ALL_ENDINGS.map(([id,name])=>{ const got=S.endings.includes(id); return `<div style="font-size:.84rem;padding:3px 0;color:${got?'var(--gold)':'var(--muted)'}">${got?'❧ '+name:'· ???'}</div>`; }).join('')+
    (done===5?'<div style="color:var(--good);font-size:.82rem;margin-top:8px">🏆 Heart of the Greenwild — every path walked!</div>':'');
}
function render(){
  stats();
  const node=N[S.node];
  $('savenote').textContent=`Endings discovered: ${S.endings.length} / 5 · progress auto-saves`;
  renderCodex();
  if(node.roleSelect){
    $('story').innerHTML=node.text;
    $('choices').innerHTML='';
    Object.keys(ROLES).forEach(r=>{ addBtn(`<b>${r}</b> — ${ROLES[r].blurb}`, ()=>{ S.role=r; const b=ROLES[r]; S.hp+=b.hp; S.stamina+=b.stamina; S.courage+=b.courage; S.supplies+=b.supplies; go('start'); }); });
    log(''); return;
  }
  if(node.end){
    if(!S.endings.includes(S.node)){ S.endings.push(S.node); localStorage.setItem('wild2_endings',JSON.stringify(S.endings)); }
    clearGame();
    $('story').innerHTML=`<span class="${node.tone||'gold'}">❧ ENDING: ${node.title} ❧</span>\n\n${node.text}\n\n<span class="muted">Final — Health ${Math.max(0,S.hp)} · Courage ${S.courage} · ${S.role}</span>`;
    $('choices').innerHTML='';
    addBtn('↻ Play again', ()=>{ S={hp:100,stamina:100,courage:50,supplies:50,role:'',node:'role',endings:S.endings}; go('role'); }, 'alt');
    log(''); return;
  }
  $('story').innerHTML = typeof node.text==='function'?node.text():node.text;
  $('choices').innerHTML='';
  node.choices.forEach(c=>addBtn(c.t, ()=>{ if(c.f)c.f(); if(S.hp<=0){ return go('end_lost'); } go(c.n); }));
  if(S.node!=='role' && S.node!=='start'){ addBtn('⟲ Restart adventure', ()=>{ clearGame(); S={hp:100,stamina:100,courage:50,supplies:50,role:'',node:'role',endings:S.endings}; go('role'); }, 'alt'); }
}
function addBtn(t,fn,cls){ const b=document.createElement('button'); b.className='btn'+(cls?' '+cls:''); b.innerHTML=t; b.onclick=fn; $('choices').appendChild(b); }

const saved=load(SKEY,null);
if(saved){ S=Object.assign(S,saved); S.endings=load('wild2_endings',[]); }
render();
</script>
</body>
</html>
